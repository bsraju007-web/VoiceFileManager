name: Build Voice File Manager APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android Project
        run: |
          mkdir -p app/src/main/java/com/example/voicefile
          mkdir -p app/src/main/res/layout

          cat << 'EOF' > settings.gradle
          rootProject.name = "VoiceFileManager"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.example.voicefile'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.voicefile"
                  minSdk 26
                  targetSdk 34
                  versionCode 5
                  versionName "2.1"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Voice File Manager"
                  android:theme="@android:style/Theme.DeviceDefault.Light">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fillViewport="true">

              <LinearLayout
                  android:gravity="center_horizontal"
                  android:layout_height="wrap_content"
                  android:layout_width="match_parent"
                  android:orientation="vertical"
                  android:padding="20dp">

                  <TextView
                      android:id="@+id/tvAlertBadge"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:background="#FFEBEE"
                      android:textColor="#C62828"
                      android:padding="12dp"
                      android:gravity="center"
                      android:textStyle="bold"
                      android:textSize="15sp"
                      android:visibility="gone"
                      android:layout_marginBottom="16dp" />

                  <TextView
                      android:id="@+id/tvTitle"
                      android:layout_height="wrap_content"
                      android:layout_width="wrap_content"
                      android:text="Daily File Review &amp; Cleaner"
                      android:textSize="20sp"
                      android:textStyle="bold"
                      android:layout_marginBottom="12dp"/>

                  <ImageView
                      android:id="@+id/ivPreview"
                      android:layout_width="match_parent"
                      android:layout_height="250dp"
                      android:scaleType="fitCenter"
                      android:background="#E0E0E0"
                      android:visibility="gone"
                      android:layout_marginBottom="12dp"/>

                  <TextView
                      android:id="@+id/tvCurrentFileName"
                      android:layout_height="wrap_content"
                      android:layout_width="wrap_content"
                      android:textSize="15sp"
                      android:textStyle="italic"
                      android:layout_marginBottom="16dp"
                      android:gravity="center"/>

                  <TextView
                      android:id="@+id/tvStatus"
                      android:layout_height="wrap_content"
                      android:layout_marginBottom="20dp"
                      android:layout_width="wrap_content"
                      android:text="Tap Review to start"
                      android:textColor="#1976D2"
                      android:textSize="16sp"
                      android:textStyle="bold"/>

                  <LinearLayout
                      android:id="@+id/reviewControls"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:visibility="gone"
                      android:layout_marginBottom="16dp">

                      <Button
                          android:id="@+id/btnVoiceRenameCurrent"
                          android:layout_height="55dp"
                          android:layout_width="match_parent"
                          android:text="🎙️ Voice Rename"
                          android:layout_marginBottom="8dp"/>

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btnDeleteCurrent"
                              android:layout_height="50dp"
                              android:layout_width="0dp"
                              android:layout_weight="1"
                              android:text="🗑️ Delete"
                              android:textColor="#D32F2F"
                              android:layout_marginEnd="6dp"/>

                          <Button
                              android:id="@+id/btnSkipCurrent"
                              android:layout_height="50dp"
                              android:layout_width="0dp"
                              android:layout_weight="1"
                              android:text="⏭️ Keep / Next"
                              android:layout_marginStart="6dp"/>
                      </LinearLayout>
                  </LinearLayout>

                  <Button
                      android:id="@+id/btnStartReview"
                      android:layout_height="60dp"
                      android:layout_width="match_parent"
                      android:text="📋 Start Daily Review"
                      android:layout_marginBottom="12dp"/>

                  <Button
                      android:id="@+id/btnVoiceSearch"
                      android:layout_height="55dp"
                      android:layout_width="match_parent"
                      android:text="🔍 Search File by Voice"/>

              </LinearLayout>
          </ScrollView>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/voicefile/MainActivity.java
          package com.example.voicefile;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.media.MediaScannerConnection;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.StrictMode;
          import android.provider.Settings;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.view.View;
          import android.webkit.MimeTypeMap;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.File;
          import java.lang.reflect.Method;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;

          public class MainActivity extends Activity {
              private TextView tvTitle, tvStatus, tvCurrentFileName, tvAlertBadge;
              private ImageView ivPreview;
              private LinearLayout reviewControls;
              private Button btnStartReview, btnVoiceRenameCurrent, btnDeleteCurrent, btnSkipCurrent, btnVoiceSearch;

              private SpeechRecognizer speechRecognizer;
              private SharedPreferences prefs;

              private List<File> pendingFiles = new ArrayList<>();
              private int currentIndex = 0;
              private boolean isSearching = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  if (Build.VERSION.SDK_INT >= 24) {
                      try {
                          Method m = StrictMode.class.getMethod("disableDeathOnFileUriExposure");
                          m.invoke(null);
                      } catch (Exception ignored) {}
                  }

                  prefs = getSharedPreferences("VoiceFilePrefs", Context.MODE_PRIVATE);

                  tvTitle = findViewById(R.id.tvTitle);
                  tvStatus = findViewById(R.id.tvStatus);
                  tvCurrentFileName = findViewById(R.id.tvCurrentFileName);
                  tvAlertBadge = findViewById(R.id.tvAlertBadge);
                  ivPreview = findViewById(R.id.ivPreview);
                  reviewControls = findViewById(R.id.reviewControls);

                  btnStartReview = findViewById(R.id.btnStartReview);
                  btnVoiceRenameCurrent = findViewById(R.id.btnVoiceRenameCurrent);
                  btnDeleteCurrent = findViewById(R.id.btnDeleteCurrent);
                  btnSkipCurrent = findViewById(R.id.btnSkipCurrent);
                  btnVoiceSearch = findViewById(R.id.btnVoiceSearch);

                  checkPermissions();
                  setupSpeechRecognizer();

                  btnStartReview.setOnClickListener(v -> startReviewProcess());

                  btnVoiceRenameCurrent.setOnClickListener(v -> {
                      isSearching = false;
                      startListening("Speak new name for this file...");
                  });

                  btnDeleteCurrent.setOnClickListener(v -> deleteCurrentFile());

                  btnSkipCurrent.setOnClickListener(v -> {
                      markReviewed(getCurrentFile());
                      nextFile();
                  });

                  btnVoiceSearch.setOnClickListener(v -> {
                      isSearching = true;
                      startListening("Speak file name to search...");
                  });

                  refreshPendingFilesList();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refreshPendingFilesList();
              }

              private Set<String> getReviewedPaths() {
                  return prefs.getStringSet("reviewed_paths", new HashSet<String>());
              }

              private void markReviewed(File file) {
                  if (file == null) return;
                  Set<String> set = new HashSet<>(getReviewedPaths());
                  set.add(file.getAbsolutePath());
                  prefs.edit().putStringSet("reviewed_paths", set).apply();
              }

              private void refreshPendingFilesList() {
                  Set<String> reviewed = getReviewedPaths();
                  pendingFiles.clear();

                  File folder = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                  File[] files = folder.listFiles(f -> f.isFile() && !f.getName().endsWith(".crdownload") && !f.getName().endsWith(".tmp"));

                  if (files != null && files.length > 0) {
                      Arrays.sort(files, (f1, f2) -> Long.compare(f2.lastModified(), f1.lastModified()));
                      for (File f : files) {
                          if (!reviewed.contains(f.getAbsolutePath())) {
                              pendingFiles.add(f);
                          }
                      }
                  }

                  if (!pendingFiles.isEmpty()) {
                      tvAlertBadge.setVisibility(View.VISIBLE);
                      tvAlertBadge.setText("⚠️ " + pendingFiles.size() + " files to review!");
                      tvStatus.setText(pendingFiles.size() + " files waiting for review");
                  } else {
                      tvAlertBadge.setVisibility(View.GONE);
                      tvStatus.setText("All downloads are reviewed! 🎉");
                  }
              }

              private void startReviewProcess() {
                  refreshPendingFilesList();
                  if (pendingFiles.isEmpty()) {
                      // Okavela anni reviewed aipothe, user malli review cheyadaniki reset option
                      prefs.edit().remove("reviewed_paths").apply();
                      refreshPendingFilesList();
                  }

                  if (pendingFiles.isEmpty()) {
                      tvStatus.setText("No files found in Downloads! 📁");
                      reviewControls.setVisibility(View.GONE);
                      ivPreview.setVisibility(View.GONE);
                      tvCurrentFileName.setText("");
                      return;
                  }

                  currentIndex = 0;
                  reviewControls.setVisibility(View.VISIBLE);
                  displayCurrentFile();
              }

              private File getCurrentFile() {
                  if (currentIndex >= 0 && currentIndex < pendingFiles.size()) {
                      return pendingFiles.get(currentIndex);
                  }
                  return null;
              }

              private void displayCurrentFile() {
                  File current = getCurrentFile();
                  if (current == null || !current.exists()) {
                      nextFile();
                      return;
                  }

                  tvStatus.setText("File (" + (currentIndex + 1) + "/" + pendingFiles.size() + ")");
                  tvCurrentFileName.setText(current.getName());

                  String name = current.getName().toLowerCase();
                  if (name.endsWith(".jpg") || name.endsWith(".jpeg") || name.endsWith(".png") || name.endsWith(".webp")) {
                      ivPreview.setVisibility(View.VISIBLE);
                      Bitmap bitmap = BitmapFactory.decodeFile(current.getAbsolutePath());
                      if (bitmap != null) {
                          ivPreview.setImageBitmap(bitmap);
                      } else {
                          ivPreview.setImageResource(android.R.drawable.ic_menu_gallery);
                      }
                  } else {
                      ivPreview.setVisibility(View.VISIBLE);
                      ivPreview.setImageResource(android.R.drawable.ic_menu_agenda);
                  }
              }

              private void deleteCurrentFile() {
                  File current = getCurrentFile();
                  if (current != null && current.exists()) {
                      String delName = current.getName();
                      if (current.delete()) {
                          Toast.makeText(this, "Deleted: " + delName, Toast.LENGTH_SHORT).show();
                          MediaScannerConnection.scanFile(this, new String[]{current.getAbsolutePath()}, null, null);
                          markReviewed(current);
                          pendingFiles.remove(currentIndex);
                          if (currentIndex >= pendingFiles.size()) {
                              currentIndex = pendingFiles.size() - 1;
                          }
                          if (!pendingFiles.isEmpty() && currentIndex >= 0) {
                              displayCurrentFile();
                          } else {
                              finishReview();
                          }
                      } else {
                          Toast.makeText(this, "Failed to delete file", Toast.LENGTH_SHORT).show();
                      }
                  }
              }

              private void renameCurrentFile(String newName) {
                  File current = getCurrentFile();
                  if (current != null && current.exists()) {
                      String oldName = current.getName();
                      String ext = oldName.contains(".") ? oldName.substring(oldName.lastIndexOf(".")) : "";
                      File target = new File(current.getParent(), newName + ext);

                      if (current.renameTo(target)) {
                          Toast.makeText(this, "Renamed to: " + target.getName(), Toast.LENGTH_LONG).show();
                          MediaScannerConnection.scanFile(this, new String[]{target.getAbsolutePath(), current.getAbsolutePath()}, null, null);
                          markReviewed(target);
                          markReviewed(current);
                          nextFile();
                      } else {
                          Toast.makeText(this, "Rename failed", Toast.LENGTH_SHORT).show();
                      }
                  }
              }

              private void nextFile() {
                  currentIndex++;
                  if (currentIndex < pendingFiles.size()) {
                      displayCurrentFile();
                  } else {
                      finishReview();
                  }
              }

              private void finishReview() {
                  tvStatus.setText("All files reviewed successfully! 🎉");
                  tvCurrentFileName.setText("");
                  ivPreview.setVisibility(View.GONE);
                  reviewControls.setVisibility(View.GONE);
                  refreshPendingFilesList();
              }

              private void setupSpeechRecognizer() {
                  speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                  speechRecognizer.setRecognitionListener(new RecognitionListener() {
                      @Override
                      public void onResults(Bundle results) {
                          ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                          if (matches != null && !matches.isEmpty()) {
                              String spokenText = matches.get(0).trim().replace(" ", "_");
                              if (isSearching) {
                                  searchAndOpen(spokenText);
                              } else {
                                  renameCurrentFile(spokenText);
                              }
                          }
                      }
                      @Override public void onError(int error) { tvStatus.setText("Voice recognition error. Try again."); }
                      @Override public void onReadyForSpeech(Bundle params) {}
                      @Override public void onBeginningOfSpeech() {}
                      @Override public void onRmsChanged(float rmsdB) {}
                      @Override public void onBufferReceived(byte[] buffer) {}
                      @Override public void onEndOfSpeech() {}
                      @Override public void onPartialResults(Bundle partialResults) {}
                      @Override public void onEvent(int eventType, Bundle params) {}
                  });
              }

              private void startListening(String prompt) {
                  tvStatus.setText(prompt);
                  Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault());
                  speechRecognizer.startListening(intent);
              }

              private void searchAndOpen(String query) {
                  File folder = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                  File[] files = folder.listFiles(File::isFile);
                  File found = null;
                  if (files != null) {
                      for (File f : files) {
                          if (f.getName().toLowerCase().contains(query.toLowerCase())) {
                              found = f;
                              break;
                          }
                      }
                  }
                  if (found != null) {
                      tvStatus.setText("Found: " + found.getName());
                      String ext = MimeTypeMap.getFileExtensionFromUrl(found.getAbsolutePath());
                      String mimeType = ext != null ? MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext.toLowerCase()) : "*/*";
                      if (mimeType == null) mimeType = "*/*";

                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      intent.setDataAndType(Uri.fromFile(found), mimeType);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);

                      try {
                          startActivity(intent);
                      } catch (Exception e) {
                          Toast.makeText(this, "No app to open this file", Toast.LENGTH_SHORT).show();
                      }
                  } else {
                      tvStatus.setText("Not found: " + query);
                  }
              }

              private void checkPermissions() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          Intent intent = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                          intent.setData(Uri.parse("package:" + getPackageName()));
                          startActivity(intent);
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  if (speechRecognizer != null) speechRecognizer.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Built APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceFileManager-APK
          path: app/build/outputs/apk/debug/app-debug.apk
