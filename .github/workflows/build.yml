name: Build Voice File Manager APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android Project
        run: |
          mkdir -p app/src/main/java/com/example/voicefile
          mkdir -p app/src/main/res/layout

          cat << 'EOF' > settings.gradle
          rootProject.name = "VoiceFileManager"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.example.voicefile'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.voicefile"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Voice File Manager"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:gravity="center"
              android:layout_height="match_parent"
              android:layout_width="match_parent"
              android:orientation="vertical"
              android:padding="24dp">
              <TextView
                  android:id="@+id/tvStatus"
                  android:layout_height="wrap_content"
                  android:layout_marginBottom="32dp"
                  android:layout_width="wrap_content"
                  android:text="Voice File Manager"
                  android:textSize="20sp"
                  android:textStyle="bold"/>
              <Button
                  android:id="@+id/btnRenameLatest"
                  android:layout_height="60dp"
                  android:layout_marginBottom="16dp"
                  android:layout_width="match_parent"
                  android:text="🎙️ Rename Latest File"/>
              <Button
                  android:id="@+id/btnVoiceSearch"
                  android:layout_height="60dp"
                  android:layout_width="match_parent"
                  android:text="🔍 Search File by Voice"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/voicefile/MainActivity.java
          package com.example.voicefile;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.widget.Button;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import java.io.File;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Locale;

          public class MainActivity extends AppCompatActivity {
              private TextView tvStatus;
              private SpeechRecognizer speechRecognizer;
              private String mode = "SEARCH";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  tvStatus = findViewById(R.id.tvStatus);
                  Button btnRename = findViewById(R.id.btnRenameLatest);
                  Button btnSearch = findViewById(R.id.btnVoiceSearch);

                  checkPermissions();
                  setupSpeechRecognizer();

                  btnRename.setOnClickListener(v -> {
                      mode = "RENAME";
                      startListening("Speak new file name...");
                  });

                  btnSearch.setOnClickListener(v -> {
                      mode = "SEARCH";
                      startListening("Speak file name to search...");
                  });
              }

              private void setupSpeechRecognizer() {
                  speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                  speechRecognizer.setRecognitionListener(new RecognitionListener() {
                      @Override
                      public void onResults(Bundle results) {
                          ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                          if (matches != null && !matches.isEmpty()) {
                              String spokenText = matches.get(0).trim().replace(" ", "_");
                              tvStatus.setText("Result: " + spokenText);
                              if ("RENAME".equals(mode)) {
                                  renameLatestFile(spokenText);
                              } else {
                                  searchAndOpen(spokenText);
                              }
                          }
                      }
                      @Override public void onError(int error) { tvStatus.setText("Voice error. Try again."); }
                      @Override public void onReadyForSpeech(Bundle params) {}
                      @Override public void onBeginningOfSpeech() {}
                      @Override public void onRmsChanged(float rmsdB) {}
                      @Override public void onBufferReceived(byte[] buffer) {}
                      @Override public void onEndOfSpeech() {}
                      @Override public void onPartialResults(Bundle partialResults) {}
                      @Override public void onEvent(int eventType, Bundle params) {}
                  });
              }

              private void startListening(String prompt) {
                  tvStatus.setText(prompt);
                  Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault());
                  speechRecognizer.startListening(intent);
              }

              private void renameLatestFile(String newName) {
                  File folder = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                  File[] files = folder.listFiles(File::isFile);
                  if (files != null && files.length > 0) {
                      Arrays.sort(files, (f1, f2) -> Long.compare(f2.lastModified(), f1.lastModified()));
                      File latest = files[0];
                      String name = latest.getName();
                      String ext = name.contains(".") ? name.substring(name.lastIndexOf(".")) : "";
                      File target = new File(latest.getParent(), newName + ext);
                      if (latest.renameTo(target)) {
                          tvStatus.setText("Renamed: " + target.getName());
                          Toast.makeText(this, "Success: " + target.getName(), Toast.LENGTH_LONG).show();
                      } else {
                          tvStatus.setText("Rename failed");
                      }
                  } else {
                      tvStatus.setText("No files in Downloads");
                  }
              }

              private void searchAndOpen(String query) {
                  File folder = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                  File[] files = folder.listFiles(File::isFile);
                  File found = null;
                  if (files != null) {
                      for (File f : files) {
                          if (f.getName().toLowerCase().contains(query.toLowerCase())) {
                              found = f;
                              break;
                          }
                      }
                  }
                  if (found != null) {
                      tvStatus.setText("Found: " + found.getName());
                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      intent.setDataAndType(Uri.fromFile(found), "*/*");
                      intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      try {
                          startActivity(intent);
                      } catch (Exception e) {
                          Toast.makeText(this, "No app to open this file", Toast.LENGTH_SHORT).show();
                      }
                  } else {
                      tvStatus.setText("Not found: " + query);
                  }
              }

              private void checkPermissions() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          Intent intent = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                          intent.setData(Uri.parse("package:" + getPackageName()));
                          startActivity(intent);
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  if (speechRecognizer != null) speechRecognizer.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Built APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceFileManager-APK
          path: app/build/outputs/apk/debug/app-debug.apk
