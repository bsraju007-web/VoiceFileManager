name: Build Voice File Manager APK

​on:

push:

branches: [ "main" ]

workflow_dispatch:

​jobs:

build:

runs-on: ubuntu-latest

​steps:

- name: Checkout

uses: actions/checkout@v4

​- name: Set up JDK 17

uses: actions/setup-java@v4

with:

java-version: '17'

distribution: 'temurin'

​- name: Setup Gradle

uses: gradle/actions/setup-gradle@v3

​- name: Auto-Generate All Project Files

run: |

mkdir -p app/src/main/java/com/example/voicefile

mkdir -p app/src/main/res/layout

​cat << 'EOF' > settings.gradle

pluginManagement {

repositories {

google()

mavenCentral()

gradlePluginPortal()

}

}

dependencyResolutionManagement {

repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

repositories {

google()

mavenCentral()

}

}

rootProject.name = "VoiceFileManager"

include ':app'

EOF

​cat << 'EOF' > build.gradle

plugins {

id 'com.android.application' version '8.2.2' apply false

id 'org.jetbrains.kotlin.android' version '1.9.22' apply false

}

EOF

​cat << 'EOF' > app/build.gradle

plugins {

id 'com.android.application'

id 'org.jetbrains.kotlin.android'

}

android {

namespace 'com.example.voicefile'

compileSdk 34

defaultConfig {

applicationId "com.example.voicefile"

minSdk 26

targetSdk 34

versionCode 1

versionName "1.0"

}

compileOptions {

sourceCompatibility JavaVersion.VERSION_17

targetCompatibility JavaVersion.VERSION_17

}

kotlinOptions {

jvmTarget = '17'

}

}

dependencies {

implementation 'androidx.core:core-ktx:1.12.0'

implementation 'androidx.appcompat:appcompat:1.6.1'

implementation 'com.google.android.material:material:1.11.0'

}

EOF

​cat << 'EOF' > app/src/main/AndroidManifest.xml

<?xml version="1.0" encoding="utf-8"?>

<manifest xmlns:android="[http://schemas.android.com/apk/res/android](http://schemas.android.com/apk/res/android)">

<uses-permission android:name="android.permission.RECORD_AUDIO" />

<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />

<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />

<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />

<application

android:allowBackup="true"

android:icon="@android:drawable/sym_def_app_icon"

android:label="Voice File Manager"

android:theme="@style/Theme.AppCompat.Light.DarkActionBar">

<activity

android:name=".MainActivity"

android:exported="true">

<intent-filter>

<action android:name="android.intent.action.MAIN" />

<category android:name="android.intent.category.LAUNCHER" />

</intent-filter>

</activity>

</application>

</manifest>

EOF

​cat << 'EOF' > app/src/main/res/layout/activity_main.xml

<?xml version="1.0" encoding="utf-8"?>

<LinearLayout android:gravity="center" android:layout_height="match_parent" android:layout_width="match_parent" android:orientation="vertical" android:padding="24dp" xmlns:android="[http://schemas.android.com/apk/res/android](http://schemas.android.com/apk/res/android)">

<TextView android:id="@+id/tvStatus" android:layout_height="wrap_content" android:layout_marginBottom="32dp" android:layout_width="wrap_content" android:text="వాయిస్ ఫైల్ మేనేజర్" android:textSize="20sp" android:textStyle="bold"/>

<Button android:id="@+id/btnRenameLatest" android:layout_height="60dp" android:layout_marginBottom="16dp" android:layout_width="match_parent" android:text="🎙️ తాజా ఫైల్ Rename చేయండి"/>

<Button android:id="@+id/btnVoiceSearch" android:layout_height="60dp" android:layout_width="match_parent" android:text="🔍 వాయిస్‌తో ఫైల్ Search చేయండి"/>

</LinearLayout>

EOF

​cat << 'EOF' > app/src/main/java/com/example/voicefile/MainActivity.kt

package com.example.voicefile

​import android.Manifest

import android.content.Intent

import android.content.pm.PackageManager

import android.net.Uri

import android.os.Build

import android.os.Bundle

import android.os.Environment

import android.provider.Settings

import android.speech.RecognitionListener

import android.speech.RecognizerIntent

import android.speech.SpeechRecognizer

import android.widget.Button

import android.widget.TextView

import android.widget.Toast

import androidx.appcompat.app.AppCompatActivity

import androidx.core.app.ActivityCompat

import androidx.core.content.ContextCompat

import java.io.File

import java.util.Locale

​class MainActivity : AppCompatActivity() {

private lateinit var tvStatus: TextView

private lateinit var speechRecognizer: SpeechRecognizer

private var mode = "SEARCH"

​override fun onCreate(savedInstanceState: Bundle?) {

super.onCreate(savedInstanceState)

setContentView(R.layout.activity_main)

​tvStatus = findViewById(R.id.tvStatus)

val btnRename = findViewById<Button>(R.id.btnRenameLatest)

val btnSearch = findViewById<Button>(R.id.btnVoiceSearch)

​checkPermissions()

setupSpeechRecognizer()

​btnRename.setOnClickListener {

mode = "RENAME"

startListening("కొత్త పేరు చెప్పండి...")

}

​btnSearch.setOnClickListener {

mode = "SEARCH"

startListening("వెతకాల్సిన ఫైల్ పేరు చెప్పండి...")

}

}

​private fun setupSpeechRecognizer() {

speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)

speechRecognizer.setRecognitionListener(object : RecognitionListener {

override fun onResults(results: Bundle?) {

val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)

if (!matches.isNullOrEmpty()) {

val spokenText = matches[0].trim().replace(" ", "_")

tvStatus.text = "మీరు చెప్పింది: $spokenText"

if (mode == "RENAME") {

renameLatestDownloadFile(spokenText)

} else {

searchAndOpen(spokenText)

}

}

}

override fun onError(error: Int) {

tvStatus.text = "వాయిస్ వినపడలేదు, మళ్లీ ప్రయత్నించండి"

}

override fun onReadyForSpeech(params: Bundle?) {}

override fun onBeginningOfSpeech() {}

override fun onRmsChanged(rmsdB: Float) {}

override fun onBufferReceived(buffer: ByteArray?) {}

override fun onEndOfSpeech() {}

override fun onPartialResults(partialResults: Bundle?) {}

override fun onEvent(eventType: Int, params: Bundle?) {}

})

}

​private fun startListening(prompt: String) {

tvStatus.text = prompt

val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {

putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)

putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault())

}

speechRecognizer.startListening(intent)

}

​private fun renameLatestDownloadFile(newName: String) {

val downloadFolder = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)

val files = downloadFolder.listFiles()?.filter { it.isFile }?.sortedByDescending { it.lastModified() }

if (!files.isNullOrEmpty()) {

val latestFile = files[0]

val extension = latestFile.extension

val newFile = File(latestFile.parent, "$newName.extension")

if (latestFile.renameTo(newFile)) {

tvStatus.text = "రీనేమ్ పూర్తయింది:\n{newFile.name}"

Toast.makeText(this, "Success: ${newFile.name}", Toast.LENGTH_LONG).show()

} else {

tvStatus.text = "రీనేమ్ విఫలమైంది"

}

} else {

tvStatus.text = "డౌన్‌లోడ్స్ ఫోల్డర్‌లో ఫైల్స్ లేవు"

}

}

​private fun searchAndOpen(query: String) {

val downloadFolder = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)

val matchedFile = downloadFolder.listFiles()?.firstOrNull {

it.isFile && it.name.contains(query, ignoreCase = true)

}

if (matchedFile != null) {

tvStatus.text = "ఫైల్ దొరికింది: ${matchedFile.name}"

val intent = Intent(Intent.ACTION_VIEW).apply {

val uri = Uri.fromFile(matchedFile)

setDataAndType(uri, "/")

flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_GRANT_READ_URI_PERMISSION

}

try {

startActivity(intent)

} catch (e: Exception) {

Toast.makeText(this, "ఈ ఫైల్ ఓపెన్ చేయడానికి యాప్ లేదు", Toast.LENGTH_SHORT).show()

}

} else {

tvStatus.text = "'$query' పేరుతో ఫైల్ దొరకలేదు"

}

}

​private fun checkPermissions() {

if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {

ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO), 101)

}

if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {

if (!Environment.isExternalStorageManager()) {

val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION).apply {

data = Uri.parse("package:$packageName")

}

startActivity(intent)

}

}

}

​override fun onDestroy() {

speechRecognizer.destroy()

super.onDestroy()

}

}

EOF

​- name: Build Debug APK

run: gradle assembleDebug

​- name: Upload Built APK

uses: actions/upload-artifact@v4

with:

name: VoiceFileManager-APK

path: app/build/outputs/apk/debug/app-debug.apk

